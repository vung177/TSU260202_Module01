<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./register.css" />
  </head>
  <body>
    <main class="container mt-5">
      <section class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
          <section class="card border-0 shadow-lg p-4">
            <div class="card-body">
              <a href="./index.html" class="text-decoration-none text-secondary small d-inline-flex align-items-center gap-1 mb-3">
                ← Back to Home
              </a>
              <div class="mb-4">
                <h2 class="text-center fw-bold mb-2">Create an Account</h2>
                <p class="text-center text-muted small">
                  Sign up for an account to use our services
                </p>
              </div>

              <form class="needs-validation">
                <div class="row mb-3">
                  <div class="col-12 col-sm-6 mb-3 mb-sm-0">
                    <label class="form-label fw-semibold">First Name</label>
                    <input
                      type="text"
                      id="firstName"
                      class="form-control form-control-md"
                      placeholder="First name"
                      required
                    />
                  </div>

                  <div class="col-12 col-sm-6">
                    <label class="form-label fw-semibold">Last Name</label>
                    <input
                      type="text"
                      id="lastName"
                      class="form-control form-control-md"
                      placeholder="Last name"
                      required
                    />
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-semibold">Email</label>
                  <input
                    type="email"
                    class="form-control"
                    placeholder="email@xyz.com"
                    id="emailInput"
                    required
                  />
                  <div class="invalid-feedback">
                    Please enter a valid email format (e.g., name@gmail.com).
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-semibold">Password</label>
                  <input
                    type="password"
                    class="form-control"
                    placeholder="••••••••"
                    id="password"
                    required
                  />
                  <div class="invalid-feedback" id="passwordError">
                    Password must be at least 8 characters!
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-semibold">Confirm Password</label>
                  <input
                    type="password"
                    class="form-control"
                    placeholder="••••••••"
                    id="confirmPassword"
                    required
                  />
                  <div class="invalid-feedback" id="confirmPasswordError">
                    Passwords do not match!
                  </div>
                </div>

                <div class="mb-4 form-check">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    id="terms"
                    required
                  />

                  <label
                    for="terms"
                    class="form-check-label small text-secondary"
                  >
                    You agree to the
                    <a href="#" class="text-primary fw-medium"
                      >terms and conditions.</a
                    >
                  </label>
                </div>

                <div class="d-grid shadow-sm">
                  <button
                    type="submit"
                    class="btn btn-primary btn-lg fw-bold"
                    style="border-radius: 8px"
                  >
                    Sign Up
                  </button>
                </div>

                <div class="text-center mt-4">
                  <span class="text-muted small">Already have an account?</span>
                  <a href="./signin.html" class="text-decoration-none fw-bold" id="logIn"
                    >Sign In</a
                  >
                </div>
              </form>
            </div>
          </section>
        </div>
      </section>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./register.js"></script>
  </body>
</html>
