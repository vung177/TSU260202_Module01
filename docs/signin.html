<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./signin.css" />
  </head>
  <body>
    <section class="container mt-3">
      <section class="row justify-content-center">
        <section class="card col-6 shadow p-4">
          <div>
            <a href="./index.html" class="text-decoration-none text-secondary small d-inline-flex align-items-center gap-1 mb-2">
              ← Back to Home
            </a>
          </div>
          <div class="p-0">
            <h2 class="mt-1 fw-semibold">Sign In</h2>
            <p>Sign in to your account to access the management system</p>
          </div>

          <form id="loginForm">
            <div class="row mb-3">
              <div class="col-12">
                <label for="email" class="form-label fw-semibold">Email:</label>
                <input
                  type="email"
                  class="form-control"
                  placeholder="Enter your email"
                  id="email"
                  required
                />
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-12">
                <label for="password" class="form-label fw-semibold">Password:</label>
                <input
                  type="password"
                  class="form-control"
                  placeholder="••••••••"
                  id="password"
                  required
                />
              </div>
            </div>

            <div class="mb-3 d-flex justify-content-between align-items-center">
              <div class="form-check mb-0">
                <input type="checkbox" class="form-check-input" id="saveId" />
                <label for="saveId" class="form-check-label">
                  <span>Remember me</span></label
                >
              </div>

              <a href="#" class="text-decoration-none" id="forgetPassword"
                >Forgot password?</a
              >
            </div>

            <div class="d-grid gap-2">
              <button class="btn btn-primary btn-lg">Sign In</button>
            </div>

            <div class="text-center mt-4">
              <span>Don't have an account?</span>
              <a href="./register.html" class="text-decoration-none fw-semibold" id="register">Sign Up</a>
            </div>
          </form>
        </section>
      </section>
    </section>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="signin.js"></script>
  </body>
</html>
